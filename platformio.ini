[platformio]
default_envs = rpipicow

[env:rpipicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64k
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; Pico W WiFi region. The default "worldwide" region makes 2.4GHz channels
    ; 12-13 receive-only, blocking association to APs using them (common in the
    ; UK/EU). Set to your country, e.g. CYW43_COUNTRY_USA, CYW43_COUNTRY_GERMANY.
    -DWIFICC=CYW43_COUNTRY_UK
lib_deps =
    lovyan03/LovyanGFX
    bblanchon/ArduinoJson

; Same firmware, plus the arduino-pico core's verbose Wi-Fi/lwIP/cyw43 logging
; over USB serial. Flash with: pio run -e rpipicow_debug -t upload
[env:rpipicow_debug]
extends = env:rpipicow
build_flags =
    ${env:rpipicow.build_flags}
    -DDEBUG_RP2040_PORT=Serial
    -DDEBUG_RP2040_WIFI
